[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrajob-backend"
version = "0.1.0"
description = "HydraJob FastAPI backend service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2,<2.0",
    "fastapi>=0.115.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "pydantic>=2.8.0,<3.0",
    "pydantic-settings>=2.4.0,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.6.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
