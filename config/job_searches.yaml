      - "FULL_TIME"
    graduation_year: 2027
    experience_level: "New Grad / Entry Level"
    included_companies: []
    excluded_companies: []
    min_match_score: 65
    filters:
      exclude_keywords:
        - "Senior"
        - "Staff"
        - "Principal"
        - "5+ years"
