# Contains all 19 seed companies across Technology, AI, and Quantitative Finance.
#
# Governance & Safety Rules:
# - Never invent or guess unverified ATS API endpoints (Greenhouse/Lever/Ashby).
# - All unverified or JavaScript-heavy career portals MUST remain `active: false`
#   and `status: NEEDS_CONFIGURATION` until inspected via:
#     POST /api/v1/sources/register  ->  POST /api/v1/sources/{id}/test
# - Respect robots.txt, rate limits, and terms of service. Never bypass auth/CAPTCHA.
# ==============================================================================

