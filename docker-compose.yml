# ==============================================================================
# HydraJob Docker Compose Stack (Phase 0 Foundation)
# ==============================================================================
# Local development:
#   docker compose up --build -d
# Local development with hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Production (AWS EC2 + Caddy HTTPS, no host port exposure for internal services):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydrajob}
      POSTGRES_USER: ${POSTGRES_USER:-hydrajob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-hydrajob_test}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supporting_codes/postgres-init:/docker-entrypoint-initdb.d:ro
    # Bound strictly to localhost in base/dev; cleared in docker-compose.prod.yml.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    expose:
      - "5432"
    networks:
      - hydrajob_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hydrajob} -d $${POSTGRES_DB:-hydrajob}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ollama_data:/root/.ollama
    # Private Docker network only — never expose port 11434 to host/internet.
    # Models are NOT auto-pulled on container startup; pull explicitly via:
    #   docker compose exec ollama ollama pull <model>
    expose:
      - "11434"
    networks:
      - hydrajob_internal
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      APP_API_KEY: ${APP_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-hydrajob}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hydrajob}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-30.0}
      TZ: ${TZ:-Asia/Kolkata}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - hydrajob_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Dashboard communicates strictly with FastAPI, never directly with PostgreSQL.
      API_BASE_URL: http://backend:8000
      APP_API_KEY: ${APP_API_KEY:-}
      TZ: ${TZ:-Asia/Kolkata}
    expose:
      - "8501"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hydrajob_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-hydrajob}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      HYDRAJOB_API_BASE_URL: http://backend:8000
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hydrajob_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    profiles:
      - production
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:-admin}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      n8n:
        condition: service_healthy
    networks:
      - hydrajob_internal

networks:
  hydrajob_internal:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
  caddy_data:
  caddy_config:
