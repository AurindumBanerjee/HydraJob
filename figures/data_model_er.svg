<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="er-title er-desc">
  <title id="er-title">HydraJob Phase 1-8 Entity Relationship Diagram</title>
  <desc id="er-desc">Relational data model across all 13 PostgreSQL tables: user_profiles, resumes, companies, company_sources, jobs, job_source_references, job_evaluations, job_applications, application_events, tasks, job_searches, ingestion_runs, and email_messages.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#14140F" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6B6960" />
    </marker>
  </defs>

  <style>
    .kicker { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #6B6960; }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #14140F; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #3B3A34; }
    .zone-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #3B3A34; }
    .tbl-title { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #14140F; }
    .col { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: #3B3A34; }
    .fk { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: #1F4A5C; font-weight: 600; }
    .rel-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #6B6960; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="1100" height="680" fill="#FBFAF6" />
  <rect x="14" y="14" width="1072" height="652" rx="8" fill="none" stroke="#D9D4C6" stroke-width="1" />

  <!-- Header -->
  <text x="32" y="42" class="kicker">HYDRAJOB / POSTGRESQL SINGLE SOURCE OF TRUTH</text>
  <text x="32" y="66" class="title">Entity-Relationship Data Model (13 Core Tables)</text>
  <text x="32" y="84" class="subtitle">All timestamps stored in UTC (DateTime timezone=True); soft-archiving (is_archived) and immutable ApplicationEvent audit history.</text>
  <line x1="32" y1="96" x2="1068" y2="96" stroke="#D9D4C6" stroke-width="1" />

  <!-- Domain Zones -->
  <rect x="32" y="112" width="224" height="498" rx="8" fill="#F3EFE5" stroke="#D9D4C6" stroke-width="1" />
  <text x="46" y="132" class="zone-label">01 / PROFILE &amp; SEARCH</text>

  <rect x="274" y="112" width="286" height="498" rx="8" fill="#F3EFE5" stroke="#D9D4C6" stroke-width="1" />
  <text x="288" y="132" class="zone-label">02 / COMPANIES &amp; JOBS</text>

  <rect x="578" y="112" width="240" height="498" rx="8" fill="#F3EFE5" stroke="#D9D4C6" stroke-width="1" />
  <text x="592" y="132" class="zone-label">03 / INGESTION &amp; MATCHING</text>

  <rect x="836" y="112" width="232" height="498" rx="8" fill="#F3EFE5" stroke="#D9D4C6" stroke-width="1" />
  <text x="850" y="132" class="zone-label">04 / APPLICATIONS &amp; EMAIL</text>

  <!-- ZONE 1: user_profiles, resumes, job_searches -->
  <g>
    <rect x="46" y="148" width="196" height="124" rx="6" fill="#DCE8EC" stroke="#14140F" stroke-width="1.5" />
    <rect x="46" y="148" width="5" height="124" rx="2" fill="#1F4A5C" />
    <text x="60" y="168" class="tbl-title">user_profiles</text>
    <line x1="56" y1="175" x2="234" y2="175" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="60" y="191" class="col">PK id (uuid)</text>
    <text x="60" y="207" class="col">name, degree, branch</text>
    <text x="60" y="223" class="col">university, graduation_year</text>
    <text x="60" y="239" class="col">cgpa, skills[], projects[]</text>
    <text x="60" y="255" class="col">preferred_roles/locations</text>
  </g>

  <g>
    <rect x="46" y="294" width="196" height="114" rx="6" fill="#DCE8EC" stroke="#14140F" stroke-width="1.5" />
    <rect x="46" y="294" width="5" height="114" rx="2" fill="#1F4A5C" />
    <text x="60" y="314" class="tbl-title">resumes</text>
    <line x1="56" y1="321" x2="234" y2="321" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="60" y="337" class="col">PK id (uuid)</text>
    <text x="60" y="353" class="col">name, file_path, file_type</text>
    <text x="60" y="369" class="col">extracted_text, skills[]</text>
    <text x="60" y="385" class="col">is_preferred, is_active</text>
    <text x="60" y="401" class="col">is_archived</text>
  </g>

  <g>
    <rect x="46" y="432" width="196" height="130" rx="6" fill="#DCE8EC" stroke="#14140F" stroke-width="1.5" />
    <rect x="46" y="432" width="5" height="130" rx="2" fill="#1F4A5C" />
    <text x="60" y="452" class="tbl-title">job_searches</text>
    <line x1="56" y1="459" x2="234" y2="459" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="60" y="475" class="col">PK id (uuid)</text>
    <text x="60" y="491" class="col">name, keywords[], roles[]</text>
    <text x="60" y="507" class="col">locations[], graduation_year</text>
    <text x="60" y="523" class="col">included/excluded_companies</text>
    <text x="60" y="539" class="col">min_match_score, filters{}</text>
    <text x="60" y="555" class="col">is_active, is_archived</text>
  </g>

  <!-- ZONE 2: companies, company_sources, jobs, job_source_references -->
  <g>
    <rect x="290" y="148" width="254" height="94" rx="6" fill="#E4EDE4" stroke="#14140F" stroke-width="1.5" />
    <rect x="290" y="148" width="5" height="94" rx="2" fill="#4E6A56" />
    <text x="304" y="168" class="tbl-title">companies</text>
    <line x1="300" y1="175" x2="534" y2="175" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="304" y="191" class="col">PK id (uuid)</text>
    <text x="304" y="207" class="col">name, UQ normalized_name</text>
    <text x="304" y="223" class="col">website, industry, is_archived</text>
  </g>

  <g>
    <rect x="290" y="264" width="254" height="114" rx="6" fill="#E4EDE4" stroke="#14140F" stroke-width="1.5" />
    <rect x="290" y="264" width="5" height="114" rx="2" fill="#4E6A56" />
    <text x="304" y="284" class="tbl-title">company_sources</text>
    <line x1="300" y1="291" x2="534" y2="291" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="304" y="307" class="col">PK id (uuid)</text>
    <text x="304" y="323" class="fk">FK company_id -&gt; companies.id</text>
    <text x="304" y="339" class="col">career_url, UQ canonical_url</text>
    <text x="304" y="355" class="col">adapter_name, status, is_active</text>
    <text x="304" y="371" class="col">consecutive_failures, last_error</text>
  </g>

  <g>
    <rect x="290" y="398" width="254" height="118" rx="6" fill="#E4EDE4" stroke="#14140F" stroke-width="1.5" />
    <rect x="290" y="398" width="5" height="118" rx="2" fill="#4E6A56" />
    <text x="304" y="418" class="tbl-title">jobs</text>
    <line x1="300" y1="425" x2="534" y2="425" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="304" y="441" class="col">PK id (uuid)</text>
    <text x="304" y="457" class="fk">FK company_id -&gt; companies.id</text>
    <text x="304" y="473" class="col">title, UQ canonical_url, ext_id</text>
    <text x="304" y="489" class="col">skills[], salary, deadline, status</text>
    <text x="304" y="505" class="col">first_seen_at, last_seen_at</text>
  </g>

  <g>
    <rect x="290" y="534" width="254" height="66" rx="6" fill="#E4EDE4" stroke="#14140F" stroke-width="1.5" />
    <rect x="290" y="534" width="5" height="66" rx="2" fill="#4E6A56" />
    <text x="304" y="553" class="tbl-title">job_source_references</text>
    <text x="304" y="571" class="fk">FK job_id, source_id (nullable)</text>
    <text x="304" y="587" class="col">source_external_id, canonical_url</text>
  </g>

  <!-- ZONE 3: job_evaluations, ingestion_runs, tasks -->
  <g>
    <rect x="594" y="148" width="208" height="142" rx="6" fill="#EEE8DA" stroke="#14140F" stroke-width="1.5" />
    <rect x="594" y="148" width="5" height="142" rx="2" fill="#B47A28" />
    <text x="608" y="168" class="tbl-title">job_evaluations</text>
    <line x1="604" y1="175" x2="792" y2="175" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="608" y="191" class="col">PK id (uuid)</text>
    <text x="608" y="207" class="fk">FK job_id -&gt; jobs.id</text>
    <text x="608" y="223" class="fk">FK profile_id, recommended_resume</text>
    <text x="608" y="239" class="col">eligibility_status, overall_score</text>
    <text x="608" y="255" class="col">component_scores{}, skills[]</text>
    <text x="608" y="271" class="col">recommendation, model_name</text>
  </g>

  <g>
    <rect x="594" y="312" width="208" height="134" rx="6" fill="#EEE8DA" stroke="#14140F" stroke-width="1.5" />
    <rect x="594" y="312" width="5" height="134" rx="2" fill="#B47A28" />
    <text x="608" y="332" class="tbl-title">ingestion_runs</text>
    <line x1="604" y1="339" x2="792" y2="339" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="608" y="355" class="col">PK id (uuid)</text>
    <text x="608" y="371" class="fk">FK source_id, extracted_job_id</text>
    <text x="608" y="387" class="col">run_type, status, errors[]</text>
    <text x="608" y="403" class="col">jobs_discovered/new/updated</text>
    <text x="608" y="419" class="col">retry_count, max_retries</text>
    <text x="608" y="435" class="col">started_at, completed_at</text>
  </g>

  <g>
    <rect x="594" y="468" width="208" height="126" rx="6" fill="#EEE8DA" stroke="#14140F" stroke-width="1.5" />
    <rect x="594" y="468" width="5" height="126" rx="2" fill="#B47A28" />
    <text x="608" y="488" class="tbl-title">tasks</text>
    <line x1="604" y1="495" x2="792" y2="495" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="608" y="511" class="col">PK id (uuid)</text>
    <text x="608" y="527" class="fk">FK job_id, application_id</text>
    <text x="608" y="543" class="col">title, task_type, due_date</text>
    <text x="608" y="559" class="col">status, priority</text>
    <text x="608" y="575" class="col">is_archived (Notion-free)</text>
  </g>

  <!-- ZONE 4: job_applications, application_events, email_messages -->
  <g>
    <rect x="850" y="148" width="204" height="136" rx="6" fill="#F1D9DD" stroke="#14140F" stroke-width="1.5" />
    <rect x="850" y="148" width="5" height="136" rx="2" fill="#7A2E3B" />
    <text x="864" y="168" class="tbl-title">job_applications</text>
    <line x1="860" y1="175" x2="1044" y2="175" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="864" y="191" class="col">PK id (uuid)</text>
    <text x="864" y="207" class="fk">FK job_id, selected_resume_id</text>
    <text x="864" y="223" class="col">status (16 lifecycle states)</text>
    <text x="864" y="239" class="col">priority, match_score</text>
    <text x="864" y="255" class="col">thread_id, application_date</text>
    <text x="864" y="271" class="col">is_archived</text>
  </g>

  <g>
    <rect x="850" y="306" width="204" height="134" rx="6" fill="#F1D9DD" stroke="#14140F" stroke-width="1.5" />
    <rect x="850" y="306" width="5" height="134" rx="2" fill="#7A2E3B" />
    <text x="864" y="326" class="tbl-title">application_events</text>
    <line x1="860" y1="333" x2="1044" y2="333" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="864" y="349" class="col">PK id (uuid)</text>
    <text x="864" y="365" class="fk">FK application_id</text>
    <text x="864" y="381" class="col">event_type, prev/new_status</text>
    <text x="864" y="397" class="col">source, confidence</text>
    <text x="864" y="413" class="col">needs_review, email_msg_id</text>
    <text x="864" y="429" class="col">occurred_at (immutable log)</text>
  </g>

  <g>
    <rect x="850" y="462" width="204" height="136" rx="6" fill="#F1D9DD" stroke="#14140F" stroke-width="1.5" />
    <rect x="850" y="462" width="5" height="136" rx="2" fill="#7A2E3B" />
    <text x="864" y="482" class="tbl-title">email_messages</text>
    <line x1="860" y1="489" x2="1044" y2="489" stroke="#14140F" stroke-width="0.75" opacity="0.25" />
    <text x="864" y="505" class="col">PK id (uuid)</text>
    <text x="864" y="521" class="col">UQ gmail_message_id, thread</text>
    <text x="864" y="537" class="col">classification (18 classes)</text>
    <text x="864" y="553" class="col">confidence, status_applied</text>
    <text x="864" y="569" class="fk">FK matched_application_id</text>
    <text x="864" y="585" class="col">needs_review, received_at</text>
  </g>

  <!-- Key Relationships (clean orthogonal routing) -->
  <!-- companies -> company_sources -->
  <line x1="417" y1="242" x2="417" y2="260" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- companies -> jobs (via left margin of zone 2) -->
  <path d="M 290 195 L 278 195 L 278 446 L 286 446" fill="none" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- jobs -> job_source_references -->
  <line x1="417" y1="516" x2="417" y2="530" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- jobs -> job_evaluations -->
  <path d="M 544 432 L 568 432 L 568 214 L 590 214" fill="none" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- jobs -> tasks -->
  <path d="M 544 486 L 568 486 L 568 525 L 590 525" fill="none" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- company_sources -> ingestion_runs -->
  <path d="M 544 330 L 590 330" fill="none" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- job_applications -> application_events -->
  <line x1="952" y1="284" x2="952" y2="302" stroke="#14140F" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- email_messages -> job_applications (along right edge of zone 4) -->
  <path d="M 1054 530 L 1062 530 L 1062 214 L 1058 214" fill="none" stroke="#6B6960" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow-muted)" />

  <!-- Footer -->
  <rect x="32" y="624" width="1036" height="26" rx="4" fill="#EEE9DD" stroke="#D9D4C6" stroke-width="1" />
  <text x="46" y="641" class="col">Cross-domain FKs: job_evaluations -> user_profiles &amp; resumes  |  job_applications -> jobs &amp; resumes  |  tasks -> jobs &amp; job_applications</text>
</svg>
